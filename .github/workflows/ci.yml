name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Reader's two halves are joined only by the wire contract, and this job guards the
# TypeScript half of it. Rails is never booted here: the Example app's minitest suite is
# a local job, by design.
jobs:
  reader:
    name: Reader
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - run: bun test
